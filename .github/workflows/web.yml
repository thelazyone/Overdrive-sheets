name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "resources/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "resources/**"
      - ".github/workflows/web.yml"

# One Pages deployment at a time (deploy-pages does not need cancel-in-progress).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/verify-ships.ts
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('/{0}/overdrive/', github.event.repository.name) || '' }}
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Stage site for Pages (/overdrive)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p _site/overdrive
          cp -r web/dist/* _site/overdrive/
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
